pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}
plugins {
    // descarga un JDK 17 si la máquina no tiene uno completo (con javac)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name = 'cachusafio-skins-fabric'
